# OpenSSF Scorecard
#
# Assesses the repository's supply-chain security practices and publishes the
# results to the public OpenSSF Scorecard API, so consumers (e.g. GitHub's
# dependency review) can show this package's score instead of "Unknown".
#
# Source repository: https://github.com/ossf/scorecard-action
# Checks documentation: https://github.com/ossf/scorecard/blob/main/docs/checks.md
name: 'NetLicensing - Scorecard'

on:
  # Re-evaluate the Branch-Protection check when rules change
  branch_protection_rule:
  # Weekly run keeps the published score current (new CVEs, maintenance activity)
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [ "master" ]
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Run analysis'
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF REST API, used by dependency review
          # and the Scorecard badge. Only works on public repositories.
          publish_results: true

      - name: 'Upload artifact'
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: 'Upload to code-scanning'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
